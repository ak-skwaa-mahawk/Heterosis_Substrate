[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heterosis-substrate"
version = "0.1.3"
authors = [
    { name = "Two Mile Solutions LLC" }
]
description = "Sovereign manifold substrate and hardened HET_FPT_IPC_v1 cryptographic authority IPC."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://github.com/ak-skwaa-mahawk/Heterosis_Substrate"
Repository = "https://github.com/ak-skwaa-mahawk/Heterosis_Substrate.git"

[project.scripts]
heterosis-cli = "heterosis.substrate_cli:main"
heterosis-orchestrator = "heterosis.orchestrator:main"

[tool.setuptools.packages.find]
where = ["src"]

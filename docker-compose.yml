version: '3.8'

services:
  heterosis-primary:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heterosis_primary
    restart: unless-stopped
    command: ["node_primary", "8000"]
    ports:
      - "8000:8000"
      - "43210:43210/udp"
    networks:
      substrate_mesh:
        ipv4_address: 172.28.0.10
    environment:
      - NODE_ID=node_primary
      - BIND_PORT=8000
      - MESH_PORT=43210
      - BROADCAST_ADDR=172.28.255.255

  heterosis-secondary:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heterosis_secondary
    restart: unless-stopped
    command: ["node_secondary", "8001"]
    ports:
      - "8001:8001"
    depends_on:
      - heterosis-primary
    networks:
      substrate_mesh:
        ipv4_address: 172.28.0.11
    environment:
      - NODE_ID=node_secondary
      - BIND_PORT=8001
      - MESH_PORT=43210
      - BROADCAST_ADDR=172.28.255.255

networks:
  substrate_mesh:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
